<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PatoPomodoro — Prototipo Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CAPA 1: VARIABLES CSS DE TEMA UI (Fácilmente modificables)
       Cambia estos valores para transformar toda la interfaz sin tocar el HTML/JS.
       ========================================================================== */
    :root {
      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Quicksand', sans-serif;
      --ui-glass-bg: rgba(255, 255, 255, 0.80);
      --ui-glass-border: rgba(255, 255, 255, 0.68);
      --ui-text-primary: #1e3a3a;
      --ui-accent: #f59e0b;
      --ui-accent-hover: #d97706;
      --ui-radius: 1.5rem;
    }

    body {
      font-family: var(--font-body);
      color: var(--ui-text-primary);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-display {
      font-family: var(--font-display);
    }

    .glass-panel {
      background: var(--ui-glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--ui-glass-border);
      border-radius: var(--ui-radius);
      box-shadow: 0 12px 32px -8px rgba(15, 45, 55, 0.18);
    }

    /* Sliders personalizados */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(30, 58, 58, 0.15);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ui-accent);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body class="relative w-screen h-screen bg-sky-900">

  <!-- LIENZO DEL LAGO (Motor 2D desacoplado) -->
  <canvas id="lakeCanvas" class="absolute inset-0 w-full h-full block cursor-pointer"></canvas>

  <!-- INTERFAZ FLOTANTE (HUD) -->
  <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-6 max-w-xl mx-auto">

    <!-- BARRA SUPERIOR: Estado, Pruebas de Patitos/Vuelo y Selector de Skin Visual -->
    <header class="flex flex-wrap items-center justify-between gap-2 pointer-events-auto">
      <div class="glass-panel px-3.5 py-2 flex items-center gap-2.5">
        <span class="text-2xl" id="modeEmoji">🦆</span>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-display font-bold text-sm sm:text-base leading-tight">PatoPomodoro</h1>
            <span id="cycleCounterBadge" class="text-[10px] bg-teal-900/10 text-teal-950 px-2 py-0.5 rounded-full font-bold">Ciclo #1</span>
          </div>
          <p id="statusSubtitle" class="text-[11px] sm:text-xs opacity-75 font-semibold">Toca el agua para dar miguitas o a un pato para oír su ¡Cuack!</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 ml-auto">
        <!-- Botón de prueba: Nace un patito de color aleatorio -->
        <button id="spawnDucklingBtn" title="Sumar un patito de color al lago" class="glass-panel px-3 py-2 flex items-center gap-1 hover:scale-105 active:scale-95 transition">
          <span class="text-base">🐣</span>
          <span id="duckCountBadge" class="font-display font-bold text-xs sm:text-sm">4</span>
          <span class="text-[10px] bg-amber-500/20 text-amber-900 px-1.5 py-0.5 rounded-full font-bold">+1 test</span>
        </button>

        <!-- Botón de prueba: Llegada o salida de patos volando -->
        <button id="flyTestBtn" title="Probar llegada o salida de patitos volando" class="glass-panel px-3 py-2 flex items-center gap-1 hover:scale-105 active:scale-95 transition">
          <span class="text-base">🪽</span>
          <span class="text-[11px] font-display font-bold">Vuelo test</span>
        </button>

        <!-- Selector de Skin Visual -->
        <select id="themeSelector" aria-label="Estilo visual" class="glass-panel px-2.5 py-2 text-xs font-bold cursor-pointer outline-none">
          <option value="cozyDay">🎨 Lago Sereno</option>
          <option value="sunsetGhibli">🌅 Atardecer</option>
          <option value="matchaMinimal">🍵 Matcha</option>
        </select>
      </div>
    </header>

    <!-- CENTRO: TARJETA DEL TEMPORIZADOR POMODORO -->
    <main class="my-auto flex flex-col items-center pointer-events-none">
      <div class="glass-panel px-6 py-5 sm:px-9 sm:py-6 flex flex-col items-center text-center pointer-events-auto transition-all duration-300 max-w-sm w-full">
        
        <!-- Selector de Modo (Trabajo / Descanso) -->
        <div class="flex bg-black/5 p-1 rounded-full mb-2.5 w-full">
          <button id="btnModeWork" class="flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all bg-white shadow-sm text-teal-900">
            🌱 Concentración
          </button>
          <button id="btnModeBreak" class="flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all opacity-70 hover:opacity-100">
            💤 Descanso
          </button>
        </div>

        <!-- Indicador de Auto-Ciclo -->
        <div class="flex items-center gap-1.5 mb-0.5">
          <span id="autoBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-900 flex items-center gap-1">
            <span>🔄</span> Auto-ciclo activo
          </span>
        </div>

        <!-- Reloj Principal -->
        <div id="timerDisplay" class="font-display font-bold text-6xl sm:text-7xl tracking-tight text-teal-950 my-0.5 tabular-nums">
          25:00
        </div>

        <!-- Controles de Tiempo Rápidos -->
        <div class="flex items-center gap-1.5 mb-3 text-xs font-semibold opacity-80">
          <span>Duración:</span>
          <button data-adjust="-5" class="time-adj-btn px-2 py-0.5 rounded bg-black/10 hover:bg-black/20 transition">-5m</button>
          <button data-adjust="-1" class="time-adj-btn px-2 py-0.5 rounded bg-black/10 hover:bg-black/20 transition">-1m</button>
          <button data-adjust="1" class="time-adj-btn px-2 py-0.5 rounded bg-black/10 hover:bg-black/20 transition">+1m</button>
          <button data-adjust="5" class="time-adj-btn px-2 py-0.5 rounded bg-black/10 hover:bg-black/20 transition">+5m</button>
        </div>

        <!-- Switch de Transición Automática Concentración <-> Descanso -->
        <label class="flex items-center justify-between w-full bg-white/55 border border-white/70 px-3.5 py-2 rounded-xl mb-3.5 cursor-pointer hover:bg-white/70 transition">
          <span class="text-xs font-bold text-teal-950 flex items-center gap-1.5">
            <span>🔁</span> Pasar automático Focus ↔ Descanso
          </span>
          <input type="checkbox" id="toggleAutoCycle" checked class="accent-amber-500 w-4 h-4 cursor-pointer" />
        </label>

        <!-- Botones Principales (Iniciar / Pausar / Reiniciar) -->
        <div class="flex items-center gap-2.5 w-full">
          <button id="btnStartPause" class="flex-1 py-3 px-5 rounded-2xl font-display font-bold text-base text-white bg-amber-500 hover:bg-amber-600 active:scale-95 transition shadow-md flex items-center justify-center gap-2">
            <span id="startPauseIcon">▶</span>
            <span id="startPauseText">Iniciar</span>
          </button>
          <button id="btnSkipPhase" title="Saltar al siguiente ciclo ahora" class="p-3 rounded-2xl bg-black/10 hover:bg-black/15 active:scale-95 transition font-bold text-base">
            ⏭
          </button>
          <button id="btnReset" title="Reiniciar reloj" class="p-3 rounded-2xl bg-black/10 hover:bg-black/15 active:scale-95 transition font-bold text-base">
            ↺
          </button>
        </div>
      </div>
    </main>

    <!-- BARRA INFERIOR: MEZCLADOR DE SONIDOS RELAJANTES -->
    <footer class="pointer-events-auto">
      <div class="glass-panel p-3.5 sm:p-5">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="text-base">🎧</span>
            <h2 class="font-display font-bold text-xs sm:text-sm uppercase tracking-wider opacity-85">Ambiente Sonoro del Lago</h2>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnTestQuack" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-950 transition">
              🦆 ¡Cuack!
            </button>
            <button id="btnMuteAll" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-teal-900/10 hover:bg-teal-900/20 transition">
              🔊 Sonido Activo
            </button>
          </div>
        </div>

        <!-- 4 Canales Independientes -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <!-- Canal 1: Agua -->
          <div class="bg-white/50 rounded-xl p-2.5 flex flex-col gap-1.5 border border-white/60">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold flex items-center gap-1">🌊 Agua</span>
              <input type="checkbox" id="toggleWater" checked class="accent-amber-500 w-4 h-4 cursor-pointer" />
            </div>
            <input type="range" id="volWater" min="0" max="1" step="0.02" value="0.45" />
          </div>

          <!-- Canal 2: Patitos (Cuacks) -->
          <div class="bg-white/50 rounded-xl p-2.5 flex flex-col gap-1.5 border border-white/60">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold flex items-center gap-1">🦆 Cuacks</span>
              <input type="checkbox" id="toggleDucks" checked class="accent-amber-500 w-4 h-4 cursor-pointer" />
            </div>
            <input type="range" id="volDucks" min="0" max="1" step="0.02" value="0.65" />
          </div>

          <!-- Canal 3: Naturaleza / Brisa -->
          <div class="bg-white/50 rounded-xl p-2.5 flex flex-col gap-1.5 border border-white/60">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold flex items-center gap-1">🍃 Bosque</span>
              <input type="checkbox" id="toggleForest" checked class="accent-amber-500 w-4 h-4 cursor-pointer" />
            </div>
            <input type="range" id="volForest" min="0" max="1" step="0.02" value="0.35" />
          </div>

          <!-- Canal 4: Música Lo-Fi / Kalimba -->
          <div class="bg-white/50 rounded-xl p-2.5 flex flex-col gap-1.5 border border-white/60">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold flex items-center gap-1">🎵 Música</span>
              <input type="checkbox" id="toggleMusic" checked class="accent-amber-500 w-4 h-4 cursor-pointer" />
            </div>
            <input type="range" id="volMusic" min="0" max="1" step="0.02" value="0.50" />
          </div>
        </div>
      </div>
    </footer>

  </div>

  <!-- ==========================================================================
       ARQUITECTURA JAVASCRIPT DESACOPLADA EN 4 MÓDULOS
       1. VISUAL_THEMES, DUCK_BREEDS & RENDERER (Independiente de la lógica)
       2. RELAXING_AUDIO_MIXER (Web Audio API con síntesis formante de ¡Cuack!)
       3. LAKE_WORLD (Físicas 2.5D, vuelo de llegada/salida, razas y estados)
       4. DRIFT_FREE_POMODORO (Reloj exacto con Auto-Transición Focus <-> Break)
       ========================================================================== -->
  <script>
    /* ==========================================================================
       MÓDULO 1: CONFIGURACIÓN VISUAL, RAZAS DE PATOS Y RENDERER DESACOPLADO
       Puedes agregar nuevos colores de patitos o cambiar todo el arte aquí.
       ========================================================================== */
    const VISUAL_THEMES = {
      cozyDay: {
        waterTop: '#2b7a78',
        waterBottom: '#17252a',
        waterBreakTint: 'rgba(15, 23, 42, 0.38)',
        rippleColor: 'rgba(222, 242, 241, 0.45)',
        lilyPadColor: '#52b788',
        lilyFlowerColor: '#ffb5a7',
        particleColor: 'rgba(254, 240, 138, 0.75)'
      },
      sunsetGhibli: {
        waterTop: '#c96480',
        waterBottom: '#2d3142',
        waterBreakTint: 'rgba(20, 14, 38, 0.45)',
        rippleColor: 'rgba(255, 229, 217, 0.45)',
        lilyPadColor: '#4a7c59',
        lilyFlowerColor: '#ffd166',
        particleColor: 'rgba(255, 209, 102, 0.85)'
      },
      matchaMinimal: {
        waterTop: '#6b9080',
        waterBottom: '#344e41',
        waterBreakTint: 'rgba(22, 34, 28, 0.42)',
        rippleColor: 'rgba(234, 244, 244, 0.4)',
        lilyPadColor: '#a3b18a',
        lilyFlowerColor: '#f6bd60',
        particleColor: 'rgba(246, 189, 96, 0.8)'
      }
    };

    // Catálogo modular de colorcitos / razas de patos
    const DUCK_BREEDS = {
      whitePekin: {
        name: 'Blanco Nube',
        body: '#ffffff',
        head: '#ffffff',
        wing: '#e2e8f0',
        beak: '#f97316',
        cheek: 'rgba(244, 114, 182, 0.42)',
        neckRing: null,
        chest: null
      },
      classicYellow: {
        name: 'Amarillo Sol',
        body: '#fde047',
        head: '#fde047',
        wing: '#facc15',
        beak: '#fb923c',
        cheek: 'rgba(251, 113, 133, 0.45)',
        neckRing: null,
        chest: null
      },
      mallard: {
        name: 'Ánade Real',
        body: '#cbd5e1',
        head: '#15803d', // Cabeza verde esmeralda clásica
        wing: '#94a3b8',
        beak: '#eab308',
        cheek: 'rgba(134, 239, 172, 0.35)',
        neckRing: '#ffffff', // Collar blanco
        chest: '#9a3412'     // Pecho castaño
      },
      pinkSakura: {
        name: 'Rosado Sakura',
        body: '#fbcfe8',
        head: '#fbcfe8',
        wing: '#f472b6',
        beak: '#fb923c',
        cheek: 'rgba(225, 29, 72, 0.35)',
        neckRing: null,
        chest: null
      },
      cinnamon: {
        name: 'Canela Cappuccino',
        body: '#d97706',
        head: '#b45309',
        wing: '#fde68a',
        beak: '#fb923c',
        cheek: 'rgba(254, 215, 170, 0.45)',
        neckRing: '#fef3c7',
        chest: null
      },
      skyBlue: {
        name: 'Celeste Cielo',
        body: '#bae6fd',
        head: '#bae6fd',
        wing: '#7dd3fc',
        beak: '#f59e0b',
        cheek: 'rgba(244, 114, 182, 0.4)',
        neckRing: null,
        chest: null
      }
    };

    const DUCK_BREED_KEYS = Object.keys(DUCK_BREEDS);

    class LakeRenderer {
      constructor(canvas, initialThemeKey = 'cozyDay') {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.theme = VISUAL_THEMES[initialThemeKey];
      }

      setTheme(themeKey) {
        if (VISUAL_THEMES[themeKey]) {
          this.theme = VISUAL_THEMES[themeKey];
        }
      }

      drawBackground(width, height, isBreakMode, timeSec) {
        const { ctx, theme } = this;
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, theme.waterTop);
        grad.addColorStop(1, theme.waterBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Ondas de luz suaves en el agua
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const y = (height * 0.15) + i * (height * 0.14) + Math.sin(timeSec * 0.8 + i) * 10;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(
            width * 0.33, y + Math.cos(timeSec + i) * 18,
            width * 0.66, y - Math.sin(timeSec + i) * 18,
            width, y
          );
          ctx.stroke();
        }
        ctx.restore();

        if (isBreakMode) {
          ctx.fillStyle = theme.waterBreakTint;
          ctx.fillRect(0, 0, width, height);
        }
      }

      drawRipple(ripple) {
        const { ctx, theme } = this;
        ctx.save();
        ctx.strokeStyle = theme.rippleColor;
        ctx.globalAlpha = Math.max(0, ripple.alpha);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(ripple.x, ripple.y, ripple.radius, ripple.radius * 0.62, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      drawLilyPad(pad, timeSec) {
        const { ctx, theme } = this;
        const swayX = Math.sin(timeSec * 0.9 + pad.seed) * 3;
        const swayY = Math.cos(timeSec * 0.7 + pad.seed) * 2;

        ctx.save();
        ctx.translate(pad.x + swayX, pad.y + swayY);
        ctx.rotate(pad.rotation + Math.sin(timeSec * 0.4 + pad.seed) * 0.05);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.beginPath();
        ctx.arc(3, 5, pad.radius, 0.25, Math.PI * 2 - 0.25);
        ctx.lineTo(3, 5);
        ctx.fill();

        ctx.fillStyle = theme.lilyPadColor;
        ctx.beginPath();
        ctx.arc(0, 0, pad.radius, 0.22, Math.PI * 2 - 0.22);
        ctx.lineTo(0, 0);
        ctx.closePath();
        ctx.fill();

        if (pad.hasFlower) {
          ctx.fillStyle = theme.lilyFlowerColor;
          for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            const angle = (i * Math.PI * 2) / 5;
            ctx.ellipse(
              Math.cos(angle) * 5,
              Math.sin(angle) * 5,
              6, 3.2, angle, 0, Math.PI * 2
            );
            ctx.fill();
          }
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      drawCrumb(crumb) {
        const { ctx } = this;
        ctx.save();
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(crumb.x, crumb.y, crumb.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* ------------------------------------------------------------------------
         RENDERIZADO DE PATITO (Soporta colores/razas, vuelo en altura Z y ¡Cuack!)
         ------------------------------------------------------------------------ */
      drawDuck(duck, timeSec) {
        const { ctx } = this;
        const breed = DUCK_BREEDS[duck.breedKey] || DUCK_BREEDS.classicYellow;
        const isBaby = duck.isBaby;
        const baseScale = isBaby ? 0.68 : 1.0;
        const isFlying = duck.z > 1 || duck.state === 'LANDING' || duck.state === 'TAKING_OFF';
        const bobOffset = isFlying ? 0 : Math.sin(timeSec * 4 + duck.seed) * 2.2;
        const facingRight = Math.cos(duck.angle) >= 0;

        // 1. Sombra proyectada sobre el agua (se achica cuando el pato vuela alto)
        const shadowScale = baseScale * Math.max(0.32, 1 - duck.z / 260);
        const shadowAlpha = Math.max(0.08, 0.22 - (duck.z / 900));
        ctx.save();
        ctx.translate(duck.x, duck.y + 12);
        ctx.scale(shadowScale, shadowScale);
        ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 2. Cuerpo del patito (elevado en -duck.z cuando va volando)
        ctx.save();
        ctx.translate(duck.x, duck.y - duck.z + bobOffset);
        ctx.scale(baseScale, baseScale);

        if (!facingRight) {
          ctx.scale(-1, 1);
        }

        // Inclinación sutil al despegar o aterrizar
        if (duck.state === 'TAKING_OFF') {
          ctx.rotate(-0.18);
        } else if (duck.state === 'LANDING' && duck.z > 8) {
          ctx.rotate(0.14);
        }

        // Ala trasera cuando está aleteando en vuelo
        if (isFlying) {
          const flap = Math.sin(timeSec * 32 + duck.seed) * 11;
          ctx.fillStyle = breed.wing;
          ctx.beginPath();
          ctx.ellipse(2, -6 + flap * 0.7, 13, 6, -0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Cuerpo redondeado
        ctx.fillStyle = breed.body;
        ctx.beginPath();
        ctx.ellipse(-2, 4, 20, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pecho de color (ej. Ánade Real / Mallard)
        if (breed.chest) {
          ctx.fillStyle = breed.chest;
          ctx.beginPath();
          ctx.ellipse(10, 4, 9, 10, 0.2, -Math.PI * 0.5, Math.PI * 0.5);
          ctx.fill();
        }

        // Colita levantada
        ctx.fillStyle = breed.body;
        ctx.beginPath();
        ctx.moveTo(-18, 2);
        ctx.lineTo(-27, -5);
        ctx.lineTo(-16, -5);
        ctx.closePath();
        ctx.fill();

        // Ala principal (aletea rápido si vuela o se sacude)
        const wingFlapY = isFlying ? Math.sin(timeSec * 32 + duck.seed) * 10 : 0;
        const wingAngle = isFlying ? -0.35 + Math.sin(timeSec * 32 + duck.seed) * 0.45 : -0.15;
        ctx.fillStyle = breed.wing;
        ctx.beginPath();
        ctx.ellipse(-3, 4 - Math.abs(wingFlapY * 0.35), 11.5, 6.8, wingAngle, 0, Math.PI * 2);
        ctx.fill();

        // Collar blanco si la raza lo incluye
        const dipOffset = duck.state === 'DIPPING' ? 7 : 0;
        if (breed.neckRing) {
          ctx.strokeStyle = breed.neckRing;
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(6, -1 + dipOffset);
          ctx.lineTo(17, 0 + dipOffset);
          ctx.stroke();
        }

        // Cabeza
        ctx.fillStyle = breed.head;
        ctx.beginPath();
        ctx.arc(12, -8 + dipOffset, 11, 0, Math.PI * 2);
        ctx.fill();

        // Pico (se abre en dos mitades cuando hace ¡Cuack!)
        ctx.fillStyle = breed.beak;
        if (duck.quackTimer > 0) {
          // Pico superior abierto
          ctx.beginPath();
          ctx.ellipse(22, -9.2 + dipOffset, 6.5, 2.7, -0.18, 0, Math.PI * 2);
          ctx.fill();
          // Pico inferior abierto
          ctx.beginPath();
          ctx.ellipse(21.5, -4.5 + dipOffset, 5.8, 2.4, 0.24, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.ellipse(22, -7 + dipOffset, 6.5, 3.8, 0.08, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ojo
        ctx.strokeStyle = '#1e293b';
        ctx.fillStyle = '#1e293b';
        if (duck.state === 'SLEEPING') {
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(15, -9 + dipOffset, 2.5, 0.1, Math.PI - 0.1);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(15, -10 + dipOffset, 2.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(15.8, -10.8 + dipOffset, 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // Mejilla sonrojada
        ctx.fillStyle = breed.cheek;
        ctx.beginPath();
        ctx.ellipse(12, -5 + dipOffset, 3.2, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 3. Efectos flotantes sobre el patito ("Zzz", "💛" o burbuja "¡Cuack!")
        const topY = duck.y - duck.z;
        if (duck.state === 'SLEEPING') {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.font = 'bold 13px Quicksand, sans-serif';
          const zFloat = (timeSec * 15 + duck.seed * 10) % 24;
          ctx.globalAlpha = 1 - zFloat / 24;
          ctx.fillText('Zzz', duck.x + 10, topY - 20 - zFloat);
          ctx.restore();
        } else if (duck.quackTimer > 0) {
          ctx.save();
          const floatUp = (0.55 - duck.quackTimer) * 18;
          ctx.font = 'bold 12px Fredoka, sans-serif';
          const text = duck.quackText || '¡Cuack!';
          const textWidth = ctx.measureText(text).width;
          const bx = duck.x - textWidth / 2 - 7;
          const by = topY - 40 - floatUp;

          // Burbujita cómic redondeada
          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.beginPath();
          ctx.roundRect(bx, by, textWidth + 14, 20, 10);
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.fillText(text, bx + 7, by + 14);
          ctx.restore();
        } else if (duck.heartTimer > 0) {
          ctx.save();
          ctx.font = '16px sans-serif';
          ctx.fillText('💛', duck.x - 8, topY - 28 - (1 - duck.heartTimer) * 15);
          ctx.restore();
        }
      }

      drawFirefly(particle, timeSec) {
        const { ctx, theme } = this;
        const pulse = 0.4 + 0.6 * Math.sin(timeSec * 3 + particle.seed);
        ctx.save();
        ctx.fillStyle = theme.particleColor;
        ctx.globalAlpha = pulse;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /* ==========================================================================
       MÓDULO 2: MOTOR DE AUDIO PROCEDURAL MULTICAPA (Web Audio API)
       Incluye síntesis acústica de "¡Cuack!" mediante barrido de doble formante
       nasal ("cua-ak") + campana zen para cambios de ciclo.
       ========================================================================== */
    class RelaxingAudioMixer {
      constructor() {
        this.ctx = null;
        this.isInitialized = false;
        this.isMutedAll = false;
        this.onAmbientQuackCallback = null;
        this.quackBuffer = null;
        // Si descargas un sonido real (ej. 'quack.mp3' en la misma carpeta), 
        // solo descomenta la línea de abajo al subirlo a GitHub Pages:
        // this.loadRealQuackSample('./quack.mp3');

        this.channels = {
          water: { enabled: true, volume: 0.45, gainNode: null },
          ducks: { enabled: true, volume: 0.65, gainNode: null },
          forest: { enabled: true, volume: 0.35, gainNode: null },
          music: { enabled: true, volume: 0.50, gainNode: null }
        };

        this.pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      }

      initIfNeeded() {
        if (this.isInitialized) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return;
        }

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1.0;
        this.masterGain.connect(this.ctx.destination);

        Object.keys(this.channels).forEach(key => {
          const g = this.ctx.createGain();
          this.channels[key].gainNode = g;
          g.connect(this.masterGain);
        });

        // Curva de saturación suave para darle textura nasal realista al "¡Cuack!"
        this.quackShaperCurve = this.makeNasalCurve(120);

        this.setupWaterStream();
        this.setupForestBreeze();
        this.setupLoopTimers();
        this.updateAllGains();
        this.isInitialized = true;
      }

      makeNasalCurve(amount = 100) {
        const nSamples = 1024;
        const curve = new Float32Array(nSamples);
        for (let i = 0; i < nSamples; i++) {
          const x = (i * 2) / nSamples - 1;
          curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
        }
        return curve;
      }

      updateAllGains() {
        if (!this.isInitialized) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.setTargetAtTime(this.isMutedAll ? 0 : 1, now, 0.1);

        Object.keys(this.channels).forEach(key => {
          const ch = this.channels[key];
          const target = ch.enabled ? ch.volume : 0;
          ch.gainNode.gain.setTargetAtTime(target, now, 0.15);
        });
      }

      setChannelState(channelName, enabled, volume) {
        this.initIfNeeded();
        const ch = this.channels[channelName];
        if (!ch) return;
        if (typeof enabled === 'boolean') ch.enabled = enabled;
        if (typeof volume === 'number') ch.volume = volume;
        this.updateAllGains();
      }

      toggleMasterMute() {
        this.initIfNeeded();
        this.isMutedAll = !this.isMutedAll;
        this.updateAllGains();
        return this.isMutedAll;
      }

      // 1. Corriente de agua relajante
      setupWaterStream() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 0.18;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 420;

        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.18;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 180;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        whiteNoise.connect(filter);
        filter.connect(this.channels.water.gainNode);

        whiteNoise.start(0);
        lfo.start(0);
      }

      // 2. Brisa en las hojas del bosque
      setupForestBreeze() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * 0.04;
        }

        const breezeSource = this.ctx.createBufferSource();
        breezeSource.buffer = noiseBuffer;
        breezeSource.loop = true;

        const bandpass = this.ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 950;
        bandpass.Q.value = 2.5;

        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.11;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 350;
        lfo.connect(lfoGain);
        lfoGain.connect(bandpass.frequency);

        breezeSource.connect(bandpass);
        bandpass.connect(this.channels.forest.gainNode);

        breezeSource.start(0);
        lfo.start(0);
      }

      /* ------------------------------------------------------------------------
         3. SINTETIZADOR DE "¡CUACK!" CON DOBLE FORMANTE VOCAL ("CUA-AK")
         Modela las cuerdas vocales ricas en armónicos (sawtooth doble) pasando
         por dos filtros resonantes que abren y cierran el pico ("u-a-k").
         ------------------------------------------------------------------------ */
      playSingleQuackSyllable(startTime, isBaby = false, duration = 0.19) {
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const shaper = this.ctx.createWaveShaper();
        const formant1 = this.ctx.createBiquadFilter();
        const formant2 = this.ctx.createBiquadFilter();
        const syllableEnv = this.ctx.createGain();

        // Frecuencia base del pato (adulto ~285Hz, bebé ~440Hz)
        const basePitch = (isBaby ? 430 : 280) * (0.94 + Math.random() * 0.12);
        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';

        // Contorno de tono: sube rápido en "CUA" y cae al cerrar el pico en "ACK"
        osc1.frequency.setValueAtTime(basePitch * 0.88, startTime);
        osc1.frequency.linearRampToValueAtTime(basePitch * 1.18, startTime + duration * 0.28);
        osc1.frequency.exponentialRampToValueAtTime(basePitch * 0.76, startTime + duration);

        // Segundo oscilador ligeramente desafinado para textura orgánica de pato
        osc2.frequency.setValueAtTime(basePitch * 0.90 + 5, startTime);
        osc2.frequency.linearRampToValueAtTime(basePitch * 1.20 + 5, startTime + duration * 0.28);
        osc2.frequency.exponentialRampToValueAtTime(basePitch * 0.78 + 5, startTime + duration);

        shaper.curve = this.quackShaperCurve;

        // Formante 1 (apertura bucal "u" -> "a" -> cierre)
        formant1.type = 'bandpass';
        formant1.Q.setValueAtTime(4.2, startTime);
        formant1.frequency.setValueAtTime(520, startTime);
        formant1.frequency.exponentialRampToValueAtTime(1250, startTime + duration * 0.35);
        formant1.frequency.exponentialRampToValueAtTime(680, startTime + duration);

        // Formante 2 (resonancia nasal característica del pato)
        formant2.type = 'bandpass';
        formant2.Q.setValueAtTime(5.0, startTime);
        formant2.frequency.setValueAtTime(1350, startTime);
        formant2.frequency.exponentialRampToValueAtTime(2450, startTime + duration * 0.35);
        formant2.frequency.exponentialRampToValueAtTime(1500, startTime + duration);

        // Envolvente de amplitud percusiva y clara
        syllableEnv.gain.setValueAtTime(0.001, startTime);
        syllableEnv.gain.linearRampToValueAtTime(0.28, startTime + 0.018);
        syllableEnv.gain.setValueAtTime(0.26, startTime + duration * 0.45);
        syllableEnv.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc1.connect(shaper);
        osc2.connect(shaper);
        shaper.connect(formant1);
        shaper.connect(formant2);
        formant1.connect(syllableEnv);
        formant2.connect(syllableEnv);
        syllableEnv.connect(this.channels.ducks.gainNode);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.02);
        osc2.stop(startTime + duration + 0.02);
      }

      triggerDuckQuack(isBaby = false, forceDouble = null) {
        this.initIfNeeded();
        if (!this.channels.ducks.enabled || this.isMutedAll) return false;

        const now = this.ctx.currentTime;
        const doDouble = forceDouble !== null ? forceDouble : (Math.random() < 0.48);

        this.playSingleQuackSyllable(now, isBaby, 0.18);
        if (doDouble) {
          this.playSingleQuackSyllable(now + 0.21, isBaby, 0.21);
        }
        return doDouble;
      }

      // Sonido suave de aleteo / chapoteo al aterrizar o despegar
      triggerWingSplash() {
        if (!this.isInitialized || !this.channels.water.enabled || this.isMutedAll) return;
        const now = this.ctx.currentTime;
        const dur = 0.35;
        const bufSize = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufSize) * Math.PI);
        }
        const src = this.ctx.createBufferSource();
        src.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(650, now);
        filter.frequency.linearRampToValueAtTime(1200, now + dur);
        filter.Q.value = 1.8;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.channels.water.gainNode);
        src.start(now);
      }

      // Campana Zen suave al cambiar automáticamente entre Concentración y Descanso
      triggerCycleChime(toBreak = true) {
        this.initIfNeeded();
        if (this.isMutedAll) return;
        const now = this.ctx.currentTime;
        const notes = toBreak ? [523.25, 659.25, 783.99] : [392.00, 523.25, 659.25, 783.99];

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const env = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);

          env.gain.setValueAtTime(0.001, now + idx * 0.14);
          env.gain.linearRampToValueAtTime(0.16, now + idx * 0.14 + 0.03);
          env.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.14 + 1.8);

          osc.connect(env);
          env.connect(this.masterGain);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 1.85);
        });
      }

      // 4. Pajarito lejano del bosque
      triggerForestBird() {
        if (!this.isInitialized || !this.channels.forest.enabled || this.isMutedAll) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const env = this.ctx.createGain();

        osc.type = 'sine';
        const f1 = 1800 + Math.random() * 600;
        osc.frequency.setValueAtTime(f1, now);
        osc.frequency.exponentialRampToValueAtTime(f1 * 1.25, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(f1 * 0.9, now + 0.18);

        env.gain.setValueAtTime(0.001, now);
        env.gain.linearRampToValueAtTime(0.05, now + 0.03);
        env.gain.exponentialRampToValueAtTime(0.001, now + 0.20);

        osc.connect(env);
        env.connect(this.channels.forest.gainNode);

        osc.start(now);
        osc.stop(now + 0.22);
      }

      // 5. Nota musical ambiental (Kalimba / Piano suave)
      triggerMusicNote() {
        if (!this.isInitialized || !this.channels.music.enabled || this.isMutedAll) return;
        const now = this.ctx.currentTime;
        const freq = this.pentatonicNotes[Math.floor(Math.random() * this.pentatonicNotes.length)];

        const osc = this.ctx.createOscillator();
        const subOsc = this.ctx.createOscillator();
        const env = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(freq * 0.5, now);

        env.gain.setValueAtTime(0.001, now);
        env.gain.linearRampToValueAtTime(0.14, now + 0.05);
        env.gain.exponentialRampToValueAtTime(0.0008, now + 2.6);

        osc.connect(env);
        subOsc.connect(env);
        env.connect(this.channels.music.gainNode);

        osc.start(now);
        subOsc.start(now);
        osc.stop(now + 2.7);
        subOsc.stop(now + 2.7);
      }

      setupLoopTimers() {
        setInterval(() => {
          if (Math.random() < 0.78) this.triggerMusicNote();
        }, 2100);

        // Cuacks orgánicos vinculados visualmente a un patito del lago
        setInterval(() => {
          if (Math.random() < 0.42 && this.onAmbientQuackCallback) {
            this.onAmbientQuackCallback();
          }
          if (Math.random() < 0.38) {
            this.triggerForestBird();
          }
        }, 4200);
      }

      // 2. Nuevo cargador de sample real con variación tipo Stardew Valley:
      async loadRealQuackSample(url) {
        try {
          if (!this.ctx) this.init();
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          this.quackBuffer = await this.ctx.decodeAudioData(arrayBuffer);
          console.log("🦆 Sample real de Cuack cargado con éxito");
        } catch (e) {
          console.warn("Usando sintetizador DSP Stardew como respaldo:", e);
        }
      }

      triggerQuack(pitchMultiplier = 1.0, forceAudible = false) {
        this.initIfNeeded();
        const vol = forceAudible ? Math.max(this.volumes.ducks, 0.45) : this.volumes.ducks;
        if (vol <= 0.01) return;

        if (this.onQuackCallback) this.onQuackCallback();

        // MODO A: Si hay un archivo .mp3/.wav real cargado, usar técnica Stardew Valley (Pitch Shifting)
        if (this.quackBuffer) {
          const source = this.ctx.createBufferSource();
          source.buffer = this.quackBuffer;
          // Variación orgánica entre 0.90x y 1.12x + el multiplicador del tipo de pato (bebé vs adulto)
          source.playbackRate.value = (0.92 + Math.random() * 0.18) * pitchMultiplier;

          const gain = this.ctx.createGain();
          gain.gain.value = vol * 0.9;

          source.connect(gain);
          gain.connect(this.ctx.destination);
          source.start();
          return;
        }

        // MODO B: Síntesis DSP estilo Stardew Valley (Siringe con Flutter AM + Formante Nasal)
        const playSingleSyllable = (delayOffset, duration, baseFreq) => {
          const now = this.ctx.currentTime + delayOffset;

          // 1. Portadora: Onda compuesta con asimetría glotal
          const osc = this.ctx.createOscillator();
          osc.type = 'sawtooth';
          // Curva de pitch clásica de Stardew: ataque rápido hacia arriba y caída nasal
          osc.frequency.setValueAtTime(baseFreq * 0.78, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.32, now + duration * 0.22);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, now + duration * 0.65);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.70, now + duration);

          // 2. El secreto: Modulador AM de "Flutter" (rugosidad de la garganta del pato a ~45 Hz)
          const flutterOsc = this.ctx.createOscillator();
          flutterOsc.type = 'sine';
          flutterOsc.frequency.setValueAtTime(42 + Math.random() * 10, now);

          const flutterDepth = this.ctx.createGain();
          flutterDepth.gain.value = 0.38; // Profundidad del rasgueo

          const flutterModulatedGain = this.ctx.createGain();
          flutterModulatedGain.gain.value = 0.62;
          flutterOsc.connect(flutterDepth);
          flutterDepth.connect(flutterModulatedGain.gain);

          // 3. Ráfaga de aire en el pico (Noise Burst en el ataque)
          const noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * duration, this.ctx.sampleRate);
          const noiseData = noiseBuf.getChannelData(0);
          for (let i = 0; i < noiseData.length; i++) {
            noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.06));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = noiseBuf;

          // 4. Filtro Formante con barrido de apertura de pico (Wah-Quack)
          const billFilter = this.ctx.createBiquadFilter();
          billFilter.type = 'bandpass';
          billFilter.Q.value = 3.8; // Menos resonante = menos robótico, más orgánico
          billFilter.frequency.setValueAtTime(750 * pitchMultiplier, now);
          billFilter.frequency.exponentialRampToValueAtTime(1650 * pitchMultiplier, now + duration * 0.28);
          billFilter.frequency.exponentialRampToValueAtTime(920 * pitchMultiplier, now + duration);

          // 5. Filtro nasal secundario (cuerpo de madera/pato)
          const bodyFilter = this.ctx.createBiquadFilter();
          bodyFilter.type = 'peaking';
          bodyFilter.frequency.value = 1150 * pitchMultiplier;
          bodyFilter.Q.value = 2.0;
          bodyFilter.gain.value = 8;

          // 6. Envolvente de amplitud percusiva y corta (Stardew style)
          const env = this.ctx.createGain();
          const peak = Math.min(vol * 0.48, 0.65);
          env.gain.setValueAtTime(0.001, now);
          env.gain.linearRampToValueAtTime(peak, now + 0.015);
          env.gain.setValueAtTime(peak * 0.85, now + duration * 0.35);
          env.gain.exponentialRampToValueAtTime(0.001, now + duration);

          // Conexión del grafo DSP
          osc.connect(flutterModulatedGain);
          flutterModulatedGain.connect(billFilter);
          noise.connect(billFilter);
          billFilter.connect(bodyFilter);
          bodyFilter.connect(env);
          env.connect(this.ctx.destination);

          osc.start(now);
          flutterOsc.start(now);
          noise.start(now);

          osc.stop(now + duration + 0.02);
          flutterOsc.stop(now + duration + 0.02);
          noise.stop(now + duration + 0.02);
        };

        const basePitch = (290 + Math.random() * 55) * pitchMultiplier;
        // Primer "¡Cuack!" corto y expresivo (160ms)
        playSingleSyllable(0, 0.16, basePitch);

        // 45% de probabilidad de segundo "¡Cuack!" rápido
        if (Math.random() < 0.45) {
          playSingleSyllable(0.19, 0.14, basePitch * 1.06);
        }
      }
    }

    /* ==========================================================================
       MÓDULO 3: SIMULACIÓN FÍSICA DEL LAGO, COLORES Y VUELO DE PATOS
       Soporta estados: SWIMMING | DIPPING | SLEEPING | LANDING | TAKING_OFF
       ========================================================================== */
    class LakeWorld {
      constructor(canvas, renderer, audioMixer, onDuckCountChange) {
        this.canvas = canvas;
        this.renderer = renderer;
        this.audio = audioMixer;
        this.onDuckCountChange = onDuckCountChange;
        this.isBreakMode = false;

        this.ducks = [];
        this.ripples = [];
        this.lilyPads = [];
        this.crumbs = [];
        this.fireflies = [];
        this.flightEventTimer = 22; // Cada cierto tiempo llega o se va un patito volando
        this.nextFlyActionIsArrival = true;

        // Conectar cuack ambiental para que un patito abra el pico en pantalla
        this.audio.onAmbientQuackCallback = () => {
          this.triggerRandomDuckQuack();
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initEntities();
        this.bindInteraction();
      }

      resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.renderer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      getRandomBreedKey() {
        return DUCK_BREED_KEYS[Math.floor(Math.random() * DUCK_BREED_KEYS.length)];
      }

      initEntities() {
        const padPositions = [
          { x: this.width * 0.16, y: this.height * 0.28, r: 28, flower: true },
          { x: this.width * 0.22, y: this.height * 0.35, r: 20, flower: false },
          { x: this.width * 0.82, y: this.height * 0.68, r: 32, flower: true },
          { x: this.width * 0.76, y: this.height * 0.75, r: 22, flower: false },
          { x: this.width * 0.18, y: this.height * 0.74, r: 25, flower: false }
        ];
        this.lilyPads = padPositions.map((p, idx) => ({
          x: p.x,
          y: p.y,
          radius: p.r,
          hasFlower: p.flower,
          rotation: idx * 1.1,
          seed: idx * 2.3
        }));

        // 4 Patitos iniciales de distintos colores para que el lago se vea lleno de vida
        this.ducks.push(this.createDuck(this.width * 0.30, this.height * 0.50, false, 'whitePekin'));
        this.ducks.push(this.createDuck(this.width * 0.68, this.height * 0.46, false, 'mallard'));
        this.ducks.push(this.createDuck(this.width * 0.24, this.height * 0.56, true, 'classicYellow'));
        this.ducks.push(this.createDuck(this.width * 0.62, this.height * 0.58, true, 'pinkSakura'));

        for (let i = 0; i < 18; i++) {
          this.fireflies.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            vx: (Math.random() - 0.5) * 14,
            vy: (Math.random() - 0.5) * 14,
            size: 1.5 + Math.random() * 2,
            seed: Math.random() * 10
          });
        }
      }

      createDuck(x, y, isBaby = false, breedKey = null) {
        return {
          x,
          y,
          z: 0, // Altura sobre el agua (0 = nadando, >0 = volando)
          angle: Math.random() * Math.PI * 2,
          targetAngle: Math.random() * Math.PI * 2,
          speed: isBaby ? 26 : 30,
          isBaby,
          breedKey: breedKey || this.getRandomBreedKey(),
          state: 'SWIMMING', // SWIMMING | DIPPING | SLEEPING | LANDING | TAKING_OFF
          stateTimer: 2 + Math.random() * 4,
          rippleTimer: 0,
          heartTimer: 0,
          quackTimer: 0,
          quackText: '¡Cuack!',
          landingTarget: null,
          seed: Math.random() * 10
        };
      }

      makeDuckQuack(duck) {
        if (!duck || duck.state === 'SLEEPING') return;
        const isDouble = this.audio.triggerQuack();
        duck.quackTimer = isDouble ? 0.62 : 0.42;
        duck.quackText = isDouble ? '¡Cuack, cuack!' : '¡Cuack!';
        this.addRipple(duck.x, duck.y, 34);
      }

      triggerRandomDuckQuack() {
        const awakeDucks = this.ducks.filter(d => d.state === 'SWIMMING' || d.state === 'DIPPING');
        if (awakeDucks.length === 0) return;
        const chosen = awakeDucks[Math.floor(Math.random() * awakeDucks.length)];
        this.makeDuckQuack(chosen);
      }

      // Nace un patito en el agua o llega volando
      spawnBabyDuckling() {
        const mother = this.ducks[0];
        const x = mother ? mother.x - 30 : this.width * 0.5;
        const y = mother ? mother.y + 20 : this.height * 0.5;
        const baby = this.createDuck(x, y, Math.random() < 0.65, this.getRandomBreedKey());
        baby.heartTimer = 1.0;
        this.ducks.push(baby);
        this.makeDuckQuack(baby);
        if (this.onDuckCountChange) this.onDuckCountChange(this.ducks.length);
        return this.ducks.length;
      }

      // Hace que un nuevo pato colorido llegue volando desde el cielo y acuatice en el lago
      spawnFlyingDuck(customBreedKey = null) {
        const fromLeft = Math.random() < 0.5;
        const startX = fromLeft ? -50 : this.width + 50;
        const targetX = this.width * (0.22 + Math.random() * 0.56);
        const targetY = this.height * (0.30 + Math.random() * 0.42);
        const startY = targetY - 30;

        const duck = this.createDuck(startX, startY, Math.random() < 0.35, customBreedKey || this.getRandomBreedKey());
        duck.z = 175 + Math.random() * 45;
        duck.state = 'LANDING';
        duck.landingTarget = { x: targetX, y: targetY };
        duck.angle = Math.atan2(targetY - startY, targetX - startX);
        duck.targetAngle = duck.angle;

        this.ducks.push(duck);
        if (this.onDuckCountChange) this.onDuckCountChange(this.ducks.length);
        return duck;
      }

      // Hace que un pato del lago tome carrera, aletee y se vaya volando al cielo
      triggerDuckTakeoff() {
        const candidates = this.ducks.filter(d => d.state === 'SWIMMING' || d.state === 'DIPPING');
        // Mantener siempre al menos 2 patitos en el lago para que nunca quede vacío
        if (candidates.length <= 2) {
          return this.spawnFlyingDuck();
        }
        const flyer = candidates[candidates.length - 1];
        flyer.state = 'TAKING_OFF';
        flyer.z = 0;
        const flyRight = Math.random() < 0.5;
        flyer.angle = flyRight ? -0.15 : Math.PI + 0.15;
        flyer.targetAngle = flyer.angle;
        this.makeDuckQuack(flyer);
        this.audio.triggerWingSplash();
        return flyer;
      }

      // Alterna llegada y salida en vuelo (para el botón de prueba o ciclos)
      triggerFlightShowcase() {
        if (this.ducks.length <= 3 || this.nextFlyActionIsArrival) {
          this.spawnFlyingDuck();
          this.nextFlyActionIsArrival = false;
        } else {
          this.triggerDuckTakeoff();
          this.nextFlyActionIsArrival = true;
        }
      }

      addRipple(x, y, maxRadius = 42) {
        this.ripples.push({
          x,
          y,
          radius: 4,
          maxRadius,
          alpha: 0.75
        });
      }

      bindInteraction() {
        this.canvas.addEventListener('pointerdown', (e) => {
          this.audio.initIfNeeded();
          const rect = this.canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;

          // ¿Tocó un patito?
          for (const duck of this.ducks) {
            const dist = Math.hypot(duck.x - clickX, (duck.y - duck.z) - clickY);
            if (dist < 34) {
              duck.heartTimer = 1.0;
              this.makeDuckQuack(duck);
              return;
            }
          }

          // Si tocó el agua: lanzar miguitas de comida y crear onda
          this.addRipple(clickX, clickY, 55);
          for (let i = 0; i < 3; i++) {
            this.crumbs.push({
              x: clickX + (Math.random() - 0.5) * 22,
              y: clickY + (Math.random() - 0.5) * 22,
              size: 2.5 + Math.random() * 1.5
            });
          }
        });
      }

      update(dt, timeSec) {
        // Eventos automáticos de patos que llegan o se van volando con el paso del tiempo
        this.flightEventTimer -= dt;
        if (this.flightEventTimer <= 0) {
          this.flightEventTimer = 25 + Math.random() * 20;
          if (!this.isBreakMode) {
            if (this.ducks.length < 7 && Math.random() < 0.65) {
              this.spawnFlyingDuck();
            } else if (this.ducks.length > 3) {
              this.triggerDuckTakeoff();
            }
          }
        }

        // Actualizar ondas en el agua
        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const r = this.ripples[i];
          r.radius += dt * 24;
          r.alpha -= dt * 0.45;
          if (r.alpha <= 0 || r.radius >= r.maxRadius) {
            this.ripples.splice(i, 1);
          }
        }

        // Actualizar patitos (iteración inversa por si un pato se va volando fuera de pantalla)
        for (let i = this.ducks.length - 1; i >= 0; i--) {
          const duck = this.ducks[i];

          if (duck.heartTimer > 0) {
            duck.heartTimer = Math.max(0, duck.heartTimer - dt * 0.8);
          }
          if (duck.quackTimer > 0) {
            duck.quackTimer = Math.max(0, duck.quackTimer - dt);
          }

          // CASO A: Pato llegando en vuelo y descendiendo al agua (LANDING)
          if (duck.state === 'LANDING') {
            const tx = duck.landingTarget.x;
            const ty = duck.landingTarget.y;
            const dist = Math.hypot(tx - duck.x, ty - duck.y);
            duck.angle = Math.atan2(ty - duck.y, tx - duck.x);

            const flySpeed = 145;
            duck.x += Math.cos(duck.angle) * flySpeed * dt;
            duck.y += Math.sin(duck.angle) * flySpeed * dt;

            // Descenso gradual proporcional a la distancia al punto de acuatizaje
            duck.z = Math.max(0, duck.z - dt * 78);

            if (dist < 24 || duck.z <= 0) {
              duck.z = 0;
              duck.state = this.isBreakMode ? 'SLEEPING' : 'SWIMMING';
              duck.targetAngle = Math.cos(duck.angle) >= 0 ? 0.1 : Math.PI - 0.1;
              this.addRipple(duck.x, duck.y, 52);
              this.addRipple(duck.x + 12, duck.y + 4, 36);
              this.audio.triggerWingSplash();
              if (!this.isBreakMode) {
                this.makeDuckQuack(duck);
              }
            }
            continue;
          }

          // CASO B: Pato tomando vuelo y subiendo al cielo (TAKING_OFF)
          if (duck.state === 'TAKING_OFF') {
            const flySpeed = 160;
            duck.x += Math.cos(duck.angle) * flySpeed * dt;
            duck.y += Math.sin(duck.angle) * flySpeed * 0.35 * dt;
            duck.z += dt * 88;

            // Chapoteo en el agua mientras despega
            if (duck.z < 28) {
              duck.rippleTimer -= dt;
              if (duck.rippleTimer <= 0) {
                this.addRipple(duck.x, duck.y + 8, 34);
                duck.rippleTimer = 0.16;
              }
            }

            // Si ya salió de la pantalla por el cielo, retirarlo de la lista
            if (duck.x < -120 || duck.x > this.width + 120 || duck.z > 360) {
              this.ducks.splice(i, 1);
              if (this.onDuckCountChange) this.onDuckCountChange(this.ducks.length);
            }
            continue;
          }

          // CASO C: En modo Descanso los patitos en el agua duermen
          if (this.isBreakMode) {
            duck.state = 'SLEEPING';
            continue;
          } else if (duck.state === 'SLEEPING') {
            duck.state = 'SWIMMING';
          }

          // CASO D: Comportamiento normal en el lago (SWIMMING / DIPPING)
          duck.stateTimer -= dt;
          if (duck.stateTimer <= 0) {
            if (duck.state === 'SWIMMING' && Math.random() < 0.25) {
              duck.state = 'DIPPING';
              duck.stateTimer = 1.1;
              this.addRipple(duck.x + Math.cos(duck.angle) * 14, duck.y, 30);
            } else {
              duck.state = 'SWIMMING';
              duck.stateTimer = 2.5 + Math.random() * 4;
              duck.targetAngle += (Math.random() - 0.5) * 1.8;
            }
          }

          // Si hay miguitas de pan, nadar hacia la más cercana
          if (this.crumbs.length > 0) {
            let nearest = this.crumbs[0];
            let minDist = Math.hypot(nearest.x - duck.x, nearest.y - duck.y);
            for (const c of this.crumbs) {
              const d = Math.hypot(c.x - duck.x, c.y - duck.y);
              if (d < minDist) {
                minDist = d;
                nearest = c;
              }
            }
            duck.targetAngle = Math.atan2(nearest.y - duck.y, nearest.x - duck.x);
            if (minDist < 18) {
              const cIdx = this.crumbs.indexOf(nearest);
              if (cIdx !== -1) this.crumbs.splice(cIdx, 1);
              duck.heartTimer = 1.0;
              this.makeDuckQuack(duck);
            }
          } else if (duck.isBaby && i > 0) {
            const leader = this.ducks[i - 1];
            if (leader && leader.z === 0) {
              const distToLeader = Math.hypot(leader.x - duck.x, leader.y - duck.y);
              if (distToLeader > 48) {
                duck.targetAngle = Math.atan2(leader.y - duck.y, leader.x - duck.x);
              }
            }
          }

          // Mantener dentro del lago
          const margin = 70;
          if (duck.x < margin) duck.targetAngle = 0;
          if (duck.x > this.width - margin) duck.targetAngle = Math.PI;
          if (duck.y < margin + 60) duck.targetAngle = Math.PI * 0.5;
          if (duck.y > this.height - margin - 80) duck.targetAngle = -Math.PI * 0.5;

          const diff = Math.atan2(
            Math.sin(duck.targetAngle - duck.angle),
            Math.cos(duck.targetAngle - duck.angle)
          );
          duck.angle += diff * dt * 2.5;

          if (duck.state === 'SWIMMING') {
            const currentSpeed = this.crumbs.length > 0 ? duck.speed * 1.45 : duck.speed;
            duck.x += Math.cos(duck.angle) * currentSpeed * dt;
            duck.y += Math.sin(duck.angle) * currentSpeed * dt;

            duck.rippleTimer -= dt;
            if (duck.rippleTimer <= 0) {
              this.addRipple(duck.x - Math.cos(duck.angle) * 10, duck.y + 6, 26);
              duck.rippleTimer = 0.65;
            }
          }
        }

        // Actualizar luciérnagas
        for (const p of this.fireflies) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x < 0) p.x = this.width;
          if (p.x > this.width) p.x = 0;
          if (p.y < 0) p.y = this.height;
          if (p.y > this.height) p.y = 0;
        }
      }

      render(timeSec) {
        this.renderer.drawBackground(this.width, this.height, this.isBreakMode, timeSec);

        for (const r of this.ripples) {
          this.renderer.drawRipple(r);
        }
        for (const pad of this.lilyPads) {
          this.renderer.drawLilyPad(pad, timeSec);
        }
        for (const c of this.crumbs) {
          this.renderer.drawCrumb(c);
        }
        // Ordenar por profundidad Y (los patos en vuelo se dibujan encima)
        const sortedDucks = [...this.ducks].sort((a, b) => (a.y + a.z * 2) - (b.y + b.z * 2));
        for (const duck of sortedDucks) {
          this.renderer.drawDuck(duck, timeSec);
        }
        for (const p of this.fireflies) {
          this.renderer.drawFirefly(p, timeSec);
        }
      }
    }

    /* ==========================================================================
       MÓDULO 4: TEMPORIZADOR POMODORO SIN DERIVA CON AUTO-TRANSICIÓN
       Pasa automáticamente de Concentración a Descanso y viceversa sin detenerse.
       ========================================================================== */
    class DriftFreePomodoro {
      constructor(onTick, onPhaseChange) {
        this.durations = { work: 25 * 60, break: 5 * 60 };
        this.mode = 'work'; // 'work' | 'break'
        this.remainingSec = this.durations.work;
        this.isRunning = false;
        this.autoTransition = true;
        this.completedWorkCycles = 0;
        this.targetTimestamp = null;
        this.intervalId = null;
        this.wakeLock = null;

        this.onTick = onTick;
        this.onPhaseChange = onPhaseChange;
      }

      setAutoTransition(enabled) {
        this.autoTransition = enabled;
      }

      setMode(newMode, autoStart = false) {
        this.pause();
        this.mode = newMode;
        this.remainingSec = this.durations[newMode];
        this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);
        if (autoStart) {
          this.start();
        }
      }

      adjustMinutes(deltaMinutes) {
        const currentMins = Math.round(this.durations[this.mode] / 60);
        const nextMins = Math.min(120, Math.max(1, currentMins + deltaMinutes));
        this.durations[this.mode] = nextMins * 60;
        if (!this.isRunning) {
          this.remainingSec = this.durations[this.mode];
          this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);
        }
      }

      async requestWakeLock() {
        if ('wakeLock' in navigator) {
          try {
            this.wakeLock = await navigator.wakeLock.request('screen');
          } catch (_) {}
        }
      }

      releaseWakeLock() {
        if (this.wakeLock) {
          this.wakeLock.release().catch(() => {});
          this.wakeLock = null;
        }
      }

      completeCurrentPhase() {
        const finishedMode = this.mode;
        if (finishedMode === 'work') {
          this.completedWorkCycles += 1;
        }
        const nextMode = finishedMode === 'work' ? 'break' : 'work';

        if (this.onPhaseChange) {
          this.onPhaseChange(finishedMode, nextMode, this.completedWorkCycles);
        }

        // Cambiar al siguiente modo y arrancar automáticamente si autoTransition está activo
        this.setMode(nextMode, this.autoTransition);
      }

      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.targetTimestamp = Date.now() + this.remainingSec * 1000;
        this.requestWakeLock();

        this.intervalId = setInterval(() => {
          const diffMs = this.targetTimestamp - Date.now();
          this.remainingSec = Math.max(0, Math.ceil(diffMs / 1000));
          this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);

          if (this.remainingSec <= 0) {
            this.completeCurrentPhase();
          }
        }, 250);

        this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);
      }

      pause() {
        this.isRunning = false;
        if (this.intervalId) {
          clearInterval(this.intervalId);
          this.intervalId = null;
        }
        this.releaseWakeLock();
        this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);
      }

      reset() {
        this.pause();
        this.remainingSec = this.durations[this.mode];
        this.onTick(this.remainingSec, this.mode, this.isRunning, this.completedWorkCycles);
      }
    }

    /* ==========================================================================
       ORQUESTACIÓN DE LA APLICACIÓN (Main Entrypoint)
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('lakeCanvas');
      const duckCountBadge = document.getElementById('duckCountBadge');

      const renderer = new LakeRenderer(canvas, 'cozyDay');
      const audio = new RelaxingAudioMixer();
      const world = new LakeWorld(canvas, renderer, audio, (newCount) => {
        duckCountBadge.textContent = newCount;
      });

      // Referencias DOM
      const timerDisplay = document.getElementById('timerDisplay');
      const btnStartPause = document.getElementById('btnStartPause');
      const startPauseIcon = document.getElementById('startPauseIcon');
      const startPauseText = document.getElementById('startPauseText');
      const btnSkipPhase = document.getElementById('btnSkipPhase');
      const btnReset = document.getElementById('btnReset');
      const btnModeWork = document.getElementById('btnModeWork');
      const btnModeBreak = document.getElementById('btnModeBreak');
      const toggleAutoCycle = document.getElementById('toggleAutoCycle');
      const autoBadge = document.getElementById('autoBadge');
      const cycleCounterBadge = document.getElementById('cycleCounterBadge');
      const modeEmoji = document.getElementById('modeEmoji');
      const statusSubtitle = document.getElementById('statusSubtitle');
      const spawnDucklingBtn = document.getElementById('spawnDucklingBtn');
      const flyTestBtn = document.getElementById('flyTestBtn');
      const btnTestQuack = document.getElementById('btnTestQuack');
      const themeSelector = document.getElementById('themeSelector');

      const formatTime = (sec) => {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      const updateUI = (remainingSec, mode, isRunning, completedCycles) => {
        timerDisplay.textContent = formatTime(remainingSec);
        startPauseIcon.textContent = isRunning ? '⏸' : '▶';
        startPauseText.textContent = isRunning ? 'Pausar' : 'Iniciar';
        cycleCounterBadge.textContent = `Ciclo #${completedCycles + 1}`;

        world.isBreakMode = (mode === 'break');
        if (mode === 'work') {
          btnModeWork.className = 'flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all bg-white shadow-sm text-teal-900';
          btnModeBreak.className = 'flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all opacity-70 hover:opacity-100';
          modeEmoji.textContent = '🦆';
          statusSubtitle.textContent = isRunning
            ? 'Concentración activa · Pasa automático a Descanso al terminar'
            : 'Toca el agua para dar miguitas o a un pato para oír su ¡Cuack!';
        } else {
          btnModeBreak.className = 'flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all bg-white shadow-sm text-teal-900';
          btnModeWork.className = 'flex-1 py-1.5 px-3 rounded-full text-xs font-bold transition-all opacity-70 hover:opacity-100';
          modeEmoji.textContent = '💤';
          statusSubtitle.textContent = isRunning
            ? 'Descanso en curso · Volverá a Concentración automáticamente'
            : 'Tiempo de descanso · Los patitos duermen en el lago';
        }
      };

      const pomodoro = new DriftFreePomodoro(
        updateUI,
        (finishedMode, nextMode) => {
          audio.triggerCycleChime(nextMode === 'break');
          if (finishedMode === 'work') {
            // Al terminar Concentración, llega un nuevo pato colorido volando
            world.spawnFlyingDuck();
          } else {
            // Al volver a Concentración desde Descanso, los patos despiertan con un ¡Cuack! y uno sale o llega volando
            world.triggerFlightShowcase();
            setTimeout(() => world.triggerRandomDuckQuack(), 450);
          }
        }
      );

      // Eventos de Botones del Reloj
      btnStartPause.addEventListener('click', () => {
        audio.initIfNeeded();
        if (pomodoro.isRunning) {
          pomodoro.pause();
        } else {
          pomodoro.start();
        }
      });

      // Botón para saltar de fase inmediatamente y ver la transición automática
      btnSkipPhase.addEventListener('click', () => {
        audio.initIfNeeded();
        pomodoro.completeCurrentPhase();
      });

      btnReset.addEventListener('click', () => pomodoro.reset());
      btnModeWork.addEventListener('click', () => pomodoro.setMode('work', false));
      btnModeBreak.addEventListener('click', () => pomodoro.setMode('break', false));

      toggleAutoCycle.addEventListener('change', (e) => {
        const enabled = e.target.checked;
        pomodoro.setAutoTransition(enabled);
        if (enabled) {
          autoBadge.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-900 flex items-center gap-1';
          autoBadge.innerHTML = '<span>🔄</span> Auto-ciclo activo';
        } else {
          autoBadge.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-500/15 text-slate-700 flex items-center gap-1';
          autoBadge.innerHTML = '<span>⏸</span> Cambio manual';
        }
      });

      document.querySelectorAll('.time-adj-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const delta = parseInt(btn.getAttribute('data-adjust'), 10);
          pomodoro.adjustMinutes(delta);
        });
      });

      // Botones de prueba en la barra superior e inferior
      spawnDucklingBtn.addEventListener('click', () => {
        audio.initIfNeeded();
        world.spawnBabyDuckling();
      });

      flyTestBtn.addEventListener('click', () => {
        audio.initIfNeeded();
        world.triggerFlightShowcase();
      });

      btnTestQuack.addEventListener('click', () => {
        audio.initIfNeeded();
        world.triggerRandomDuckQuack();
      });

      themeSelector.addEventListener('change', (e) => {
        renderer.setTheme(e.target.value);
      });

      // Controles del Mezclador de Audio
      const bindChannelControl = (channelKey, toggleId, sliderId) => {
        const toggleEl = document.getElementById(toggleId);
        const sliderEl = document.getElementById(sliderId);
        toggleEl.addEventListener('change', () => {
          audio.setChannelState(channelKey, toggleEl.checked, parseFloat(sliderEl.value));
        });
        sliderEl.addEventListener('input', () => {
          audio.setChannelState(channelKey, toggleEl.checked, parseFloat(sliderEl.value));
        });
      };

      bindChannelControl('water', 'toggleWater', 'volWater');
      bindChannelControl('ducks', 'toggleDucks', 'volDucks');
      bindChannelControl('forest', 'toggleForest', 'volForest');
      bindChannelControl('music', 'toggleMusic', 'volMusic');

      const btnMuteAll = document.getElementById('btnMuteAll');
      btnMuteAll.addEventListener('click', () => {
        const muted = audio.toggleMasterMute();
        btnMuteAll.textContent = muted ? '🔇 Silenciado' : '🔊 Sonido Activo';
      });

      // Bucle principal a 60 FPS
      let lastTime = performance.now();
      const loop = (now) => {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const timeSec = now / 1000;

        world.update(dt, timeSec);
        world.render(timeSec);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
